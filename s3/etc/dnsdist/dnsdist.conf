-- Water-torture defence in front of pdns: drop queries whose first label is all-lowercase and has a digit followed by a letter (the attack generator) before they reach MySQL. Real names have digits only at the end; the bench legitimately registers mixed-case random names during its integrity check, so any uppercase letter means allow.
-- randomly generated (mixed case, or a digit followed by a letter) before they
-- reach MySQL. Real names are lowercase with digits only at the end, except a
-- few service-name entries in the zone (allowlisted).
setLocal("192.168.0.13:53")
newServer({address="127.0.0.1:5300"})
local allow = { l2f=true, ospf6d=true, pop3s=true, rpc2portmap=true }
function isRandomLabel(dq)
  local label = dq.qname:toString():match("^([^.]+)%.")
  if label == nil or allow[label:lower()] then return false end
  return label:find("%u") == nil and label:find("%d%a") ~= nil
end
addAction(LuaRule(isRandomLabel), DropAction())
